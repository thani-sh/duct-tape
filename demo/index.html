<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duct-Tape RPG Character Generator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #090d16;
        --card-bg: #111827;
        --text: #f9fafb;
        --text-muted: #9ca3af;
        --primary: #8b5cf6;
        --primary-hover: #7c3aed;
        --success: #10b981;
        --error: #ef4444;
        --border: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(139, 92, 246, 0.4);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.6);
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 2rem;
      }

      header {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto 2rem auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.5rem;
      }

      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #a78bfa, var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .badge {
        background-color: #1e1b4b;
        border: 1px solid #4338ca;
        color: #c7d2fe;
        font-size: 0.75rem;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      @media (min-width: 992px) {
        .container {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
        }
      }

      .panel {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        min-width: 0;
      }

      .panel-title {
        font-size: 1.2rem;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      textarea {
        width: 100%;
        min-height: 80px;
        background-color: #030712;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.75rem;
        color: var(--text);
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        resize: none;
        transition: border-color 0.2s;
      }

      textarea:focus {
        border-color: var(--primary);
      }

      .canvas-preview-container {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #030712;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 1.5rem;
        min-height: 280px;
      }

      canvas {
        image-rendering: pixelated;
        background-color: #1f2937;
        border: 2px solid var(--border);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        width: 256px;
        height: 256px;
      }

      button {
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 0.5rem;
        padding: 0.85rem 1.5rem;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.1s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }

      button:hover {
        background-color: var(--primary-hover);
      }

      button:active {
        transform: scale(0.98);
      }

      button:disabled {
        background-color: #1f2937;
        color: var(--text-muted);
        cursor: not-allowed;
      }

      .actions-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 680px;
        min-width: 0;
      }

      .actions-header {
        background-color: #111827;
        border: 1px solid var(--border);
        border-bottom: none;
        border-top-left-radius: 1rem;
        border-top-right-radius: 1rem;
        padding: 1rem 1.25rem;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .actions-container {
        flex-grow: 1;
        background-color: #070b13;
        border: 1px solid var(--border);
        border-bottom-left-radius: 1rem;
        border-bottom-right-radius: 1rem;
        padding: 1.5rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        min-width: 0;
        width: 100%;
      }

      /* Collapsible Attempt Cards */
      .attempt-card {
        background: linear-gradient(145deg, #131b2e, #0f1524);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        max-width: 100%;
        min-width: 0;
      }

      .attempt-card[open] {
        border-color: var(--primary);
      }

      .attempt-summary {
        background-color: rgba(255, 255, 255, 0.02);
        padding: 1rem 1.25rem;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        outline: none;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .attempt-summary:hover {
        background-color: rgba(255, 255, 255, 0.05);
      }

      .attempt-content {
        padding: 1.5rem 1.25rem;
        display: flex;
        flex-direction: column;
        background-color: transparent;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
      }

      /* Visual Pipeline Stepper */
      .pipeline-step {
        display: flex;
        flex-direction: column;
        border-left: 2px solid rgba(255, 255, 255, 0.05);
        margin-left: 0.75rem;
        padding-left: 1.5rem;
        position: relative;
        padding-bottom: 1.5rem;
        max-width: 100%;
        min-width: 0;
      }

      .pipeline-step:last-child {
        padding-bottom: 0;
        border-left-color: transparent;
      }

      .step-indicator {
        position: absolute;
        left: -9px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #1e293b;
        border: 2px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        z-index: 2;
      }

      .pipeline-step.running .step-indicator {
        background: var(--primary);
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
        animation: pulse 1.5s infinite;
      }

      .pipeline-step.success .step-indicator {
        background: var(--success);
        border-color: var(--success);
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }

      .pipeline-step.failed .step-indicator {
        background: var(--error);
        border-color: var(--error);
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
      }

      .step-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
      }

      .step-title-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .step-title-group span.icon {
        font-size: 1rem;
      }

      .step-badge {
        font-size: 0.7rem;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .step-badge.pending {
        background: #1e293b;
        color: var(--text-muted);
      }

      .step-badge.running {
        background: rgba(139, 92, 246, 0.15);
        color: #a78bfa;
      }

      .step-badge.success {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
      }

      .step-badge.failed {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
      }

      .step-details {
        margin-top: 0.75rem;
        background: #040810;
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 0.5rem;
        padding: 1rem;
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text);
        max-height: 260px;
        overflow-y: auto;
        overflow-x: hidden;
        max-width: 100%;
        min-width: 0;
        display: none;
      }

      .step-details.visible {
        display: block;
      }

      .step-details-toggle {
        font-size: 0.75rem;
        color: var(--text-muted);
        transition: transform 0.2s;
        display: inline-block;
      }

      .step-details-toggle.open {
        transform: rotate(90deg);
      }

      .thumbnail-container {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 0.5rem;
        max-width: 100%;
        min-width: 0;
      }

      .thumbnail-img {
        width: 120px;
        height: 120px;
        border-radius: 0.5rem;
        border: 2px solid rgba(255, 255, 255, 0.1);
        image-rendering: pixelated;
        background-color: #1f2937;
      }

      pre {
        background-color: #020408;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 0.375rem;
        padding: 0.75rem;
        overflow-x: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: #34d399;
        max-height: 150px;
        max-width: 100%;
      }

      .error-box {
        color: #f87171;
        background: rgba(239, 68, 68, 0.05);
        border: 1px solid rgba(239, 68, 68, 0.15);
        border-radius: 0.375rem;
        padding: 0.75rem;
        font-family: "JetBrains Mono", monospace;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        max-width: 100%;
      }

      .code-panel {
        margin-top: 1rem;
        display: none;
      }

      .code-panel.visible {
        display: block;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(139, 92, 246, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(139, 92, 246, 0);
        }
      }

      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 3px solid white;
        width: 18px;
        height: 18px;
        animation: spin 1s linear infinite;
        display: none;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Duct-Tape RPG Character Generator</h1>
        <p
          style="
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
          "
        >
          Generates Canvas-based RPG Pixel Art and self-corrects using Gemini
          3.1 Flash Lite
        </p>
      </div>
      <span class="badge">Gemini-3.1-Flash-Lite</span>
    </header>

    <div class="container">
      <section class="panel">
        <div class="panel-title">Character Input</div>

        <div class="form-group">
          <label for="prompt">Character Description</label>
          <textarea id="prompt">
A retro blue wizard holding a yellow staff in his left hand, standing next to a small green slime creature, retro 8-bit pixel art style</textarea
          >
        </div>

        <div class="form-group">
          <label>Live Rendering Canvas (256x256)</label>
          <div class="canvas-preview-container">
            <canvas id="rpgCanvas" width="256" height="256"></canvas>
          </div>
        </div>

        <button id="runBtn" onclick="runGenerator()">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Generate RPG Character</span>
        </button>
      </section>

      <section class="actions-panel">
        <div class="actions-header">
          <span>Self-Healing Orchestration Actions</span>
        </div>
        <div class="actions-container" id="consoleOutput">
          <span class="log-item" style="color: var(--text-muted)"
            >Awaiting generation request. Click above to begin.</span
          >
        </div>

        <details class="code-panel" id="codePanel">
          <summary
            style="
              font-size: 0.75rem;
              font-weight: 700;
              color: var(--text-muted);
              text-transform: uppercase;
              letter-spacing: 0.05em;
              cursor: pointer;
              outline: none;
            "
          >
            Healed Canvas Code (Click to Expand/Collapse)
          </summary>
          <pre style="margin-top: 0.5rem"><code id="codeBlock"></code></pre>
        </details>
      </section>
    </div>

    <script src="/public/client.js"></script>
  </body>
</html>
